.sub{color:var(--mu);font-size:13px;margin-top:4px}
#rf{position:absolute;left:14px;top:26px;width:42px;height:42px;padding:0;border-radius:50%;font-size:18px}
#rf.spin{animation:sp .7s linear}@keyframes sp{to{transform:rotate(360deg)}}
main{padding:10px 14px;max-width:680px;margin:auto;animation:up .35s ease}@keyframes up{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--gl);border:1px solid var(--gb);border-radius:26px;padding:16px;margin-bottom:12px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.wrap{flex-wrap:wrap}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:5px}
input{width:100%;padding:13px;border:1px solid var(--ln);border-radius:16px;background:var(--in);color:var(--tx);font:inherit;outline:0}
input:focus{border-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
button{padding:13px 16px;border:0;border-radius:16px;background:var(--ac);color:var(--act);font:inherit;font-weight:700;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.96)}
button.s{background:var(--in);color:var(--tx);border:1px solid var(--ln)}button.d{background:none;color:var(--bad);border:1px solid var(--bad)}
.big{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.1}.md{font-size:26px;font-weight:800}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;flex:none;background:linear-gradient(135deg,hsl(var(--h) 72% 58%),hsl(calc(var(--h) + 45) 70% 44%))}
.sh{font-weight:800;font-size:20px;min-width:70px;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{padding:8px 13px;border-radius:999px;background:var(--in);border:1px solid var(--ln);font-size:13px;font-weight:600;color:var(--tx);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}.chip.on.v{background:var(--bad);border-color:var(--bad);color:#fff}.dis{opacity:.45;pointer-events:none}
.badge{font-size:12px;padding:5px 11px;border-radius:20px;background:var(--in);color:var(--mu);font-weight:700}.badge.c{background:var(--ok);color:#fff}.badge.w{background:#e8a317;color:#fff}
.mon{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}.mon::-webkit-scrollbar{display:none}
.tile{text-align:center;cursor:pointer;padding:16px 10px}.tile .av{margin:0 auto 8px;width:54px;height:54px;font-size:22px}
.bar{height:7px;border-radius:7px;background:var(--in);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--o1),#c07a32)}
.drow{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;color:var(--tx);border-bottom:1px solid var(--ln);border-radius:0;padding:13px 4px;text-align:right}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:660px;display:flex;background:var(--gl);border:1px solid var(--gb);border-radius:30px;padding:6px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:24px;padding:8px 2px;font-size:11px;font-weight:700;line-height:1.35}nav button b{display:block;font-size:20px}
nav button.on{background:var(--ac);color:var(--act)}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:var(--ac);color:var(--act);padding:11px 20px;border-radius:30px;font-weight:700;font-size:14px;z-index:20;transition:transform .3s}#toast.on{transform:translate(-50%,0)}
#sheet{display:none}#sheet.on{display:block}
#sheet .bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

.pr{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--ln);font-size:14px;font-weight:600}.pr input{width:24px;height:24px;accent-color:#c07a32;padding:0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 4px;border-bottom:1px solid var(--ln);text-align:right}
</style>

<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<header><div class="logo" role="img" aria-label="Cafe Supreme"></div><div class="sub" id="who">نظام التبس ☕</div><button id="rf" class="s" title="تحديث">🔄</button></header>
<main id="app"></main><nav id="nav"></nav><div id="sheet"></div><div id="toast"></div>
<script>
const SB_URL="https://fqxjjwenujclkwoshrlg.supabase.co",SB_KEY="sb_publishable_xJ0f_Z5weu5xX3LY_uzARQ_Dtp3xmzs";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n2=x=>(Math.round((+x||0)*100)/100).toFixed(2);
const TODAY=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Riyadh"});
const EM={present:"✅",late:"⏰",early:"🚪",leave:"🌴",absent:"❌"};
const LB={present:"حضر",late:"تأخير",early:"انصراف مبكر",leave:"إجازة",absent:"غياب"};
const P={tips:["💰","تسجيل التبس واعتماد اليوم"],att:["🗓️","تسجيل الحضور والغياب"],vio:["⚠️","تسجيل المخالفات"],view_all:["👀","رؤية بيانات الفريق وأيام الشهور"],view_total:["📊","رؤية إجمالي التبس اليومي"],manage:["🛠️","إدارة الفريق والإعدادات"]};
let T=new URLSearchParams(location.search).get("t")||"";
try{if(T)localStorage.setItem("tipsT",T);else T=localStorage.getItem("tipsT")||""}catch(e){}
const S={tab:"",month:TODAY().slice(0,7),date:TODAY(),me:null,cfg:null,mine:null,day:null,dl:[],rep:null,list:[],sheet:null,first:true};
const can=k=>!!S.me?.perms?.[k];const canTotal=()=>can("view_total")||can("manage");
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0)*7%360;
const av=n=>`<div class="av" style="--h:${hue(n)}">${esc([...n][0]||"؟")}</div>`;
const wd=d=>new Date(d+"T12:00:00").toLocaleDateString("ar-EG-u-nu-latn",{weekday:"long"});
const mlabel=m=>new Date(m+"-15T12:00:00").toLocaleDateString("ar-EG-u-nu-latn",{month:"long",year:"numeric"});
const shift=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toLocaleDateString("en-CA")};
const months=()=>{const o=[],x=new Date();x.setDate(15);for(let i=0;i<12;i++){o.push(x.toLocaleDateString("en-CA").slice(0,7));x.setMonth(x.getMonth()-1)}return o};
const mchips=()=>`<div class="mon">${months().map(m=>`<button class="chip ${m===S.month?"on":""}" data-mon="${m}">${mlabel(m)}</button>`).join("")}</div>`;
const vname=id=>S.cfg.vios.find(v=>v.id===id)?.name||"";
let tt;function toast(m){const t=$("toast");t.textContent=m;t.className="on";clearTimeout(tt);tt=setTimeout(()=>t.className="",1800)}
async function api(fn,a={}){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_token:T,...a})});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||"error");return j;
}
function block(m){$("nav").style.display="none";$("app").innerHTML=`<div class="card" style="text-align:center;font-size:17px">${m}</div>`}
function fail(e){
  const m=e.message||"";
  if(/unauthorized/.test(m))return block("🔒 اللينك ده غير صالح أو تم إيقافه.<br><span class='mu'>اطلب لينك جديد من المسؤول.</span>");
  toast(/closed/.test(m)?"🔒 اليوم معتمد ومقفول":/forbidden/.test(m)?"⛔ مفيش صلاحية":/no_amount/.test(m)?"💰 اكتب التوتال الأول":/no_eligible/.test(m)?"👥 مفيش موظف مستحق (النقاط صفر؟)":/self/.test(m)?"مينفعش تعدّل حسابك":"حصل خطأ، جرّب تاني");
  render();
}
async function run(fn,a,ok="تم ✓"){try{await api(fn,a);await render(true);toast(ok)}catch(e){fail(e)}}
function tabs(){
  const t=[];
  if(can("tips")||can("att")||can("vio")||can("view_all"))t.push(["day","📝","اليوم"]);
  if(can("view_all")||can("manage")||can("tips"))t.push(["month","📅","الشهور"]);
  if(can("manage"))t.push(["team","👥","الفريق"],["set","⚙️","الإعدادات"]);
  t.push(["mine","💰","نصيبي"]);return t;
}
async function render(keep){
  if(!S.me)return;
  const t=tabs();if(S.first){S.tab=t[0][0];S.first=false}if(!t.some(x=>x[0]===S.tab))S.tab=t[0][0];
  $("nav").innerHTML=t.length>1?t.map(x=>`<button data-tab="${x[0]}" class="${S.tab===x[0]?"on":""}"><b>${x[1]}</b>${x[2]}</button>`).join(""):"";
  $("nav").style.display=t.length>1?"flex":"none";
  try{
    if(S.tab==="mine")S.mine=await api("tips_me",{p_month:S.month});
    else if(S.tab==="day")S.day=await api("tips_day_get",{p_day:S.date});
    else if(S.tab==="month"){[S.rep,S.dl]=await Promise.all([can("view_all")||can("manage")?api("tips_report",{p_month:S.month}):null,api("tips_days_list",{p_month:S.month})])}
    else if(S.tab==="team")S.list=await api("tips_staff_list",{p_month:S.month});
    else if(S.tab==="set"){S.log=await api("tips_log_list")}
  }catch(e){return fail(e)}
  const y=scrollY;({mine:vMine,day:vDay,month:vMonth,team:vTeam,set:vSet}[S.tab])();drawSheet();if(keep)scrollTo(0,y);
}
function vMine(){
  const m=S.mine,tot=m.days.reduce((a,d)=>a+(+d.share||0),0),td=m.today;
  const pr=m.days.filter(d=>d.status!=="absent").length,ab=m.days.length-pr,vi=m.days.filter(d=>d.vio).length;
  const inst=(matchMedia("(display-mode: standalone)").matches||navigator.standalone)?"":`<div class="card mu">📲 تثبيت التطبيق: في آيفون اضغط زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية». في أندرويد اضغط ⋮ ثم «تثبيت التطبيق».</div>`;
  $("app").innerHTML=`<div class="card"><div class="row">${av(S.me.name)}<div style="flex:1"><div class="mu">أهلًا ${esc(S.me.name)} 👋</div><div class="mu">نصيبك النهارده</div></div>${td?`<span class="badge ${td.closed?"c":""}">${EM[td.status]} ${LB[td.status]}</span>`:""}</div>
  <div class="big" style="margin-top:10px">${td?.closed?n2(td.share):"—"}</div><div class="mu">${td?.closed?"تم اعتماد اليوم ✅":"بيظهر نصيبك بعد ما اليوم يتقفل ⏳"}</div></div>
  ${mchips()}
  <div class="grid"><div class="card"><div class="mu">💰 إجمالي الشهر</div><div class="md">${n2(tot)}</div></div><div class="card"><div class="mu">⭐ نقاطك</div><div class="md">${m.pts}</div></div>
  <div class="card"><div class="mu">✅ أيام الحضور</div><div class="md">${pr}</div></div><div class="card"><div class="mu">❌ غياب · ⚠️ مخالفات</div><div class="md">${ab} · ${vi}</div></div></div>
  <div class="card"><h2>📆 أيام ${mlabel(S.month)}</h2>${m.days.map(d=>`<div class="row" style="padding:11px 0;border-top:1px solid var(--ln)"><div><b>${d.day.slice(5)}</b> <span class="mu">${wd(d.day)}</span><div class="mu">${EM[d.status]} ${LB[d.status]}${d.vio?" · ⚠️ "+esc(vname(d.vio)):""}</div></div><div style="text-align:left"><div class="sh">${n2(d.share)}</div>${d.amt!=null?`<div class="mu">التوتال ${n2(d.amt)}</div>`:""}</div></div>`).join("")||'<div class="mu">لا أيام معتمدة بعد 🌱</div>'}</div>${inst}`;
}
function vDay(){
  const d=S.day,c=d.closed,ta=can("tips")&&!c,aa=can("att")&&!c,va=can("vio")&&!c,pres=d.rows.filter(r=>r.status!=="absent").length;
  let h=`<div class="card"><div class="row"><button class="s" data-dd="-1">→ السابق</button><div style="text-align:center;flex:1"><b>${wd(S.date)}</b><div class="mu">${S.date}${S.date===TODAY()?" · اليوم":""}</div></div><button class="s" data-dd="1">التالي ←</button></div>
  <div class="row" style="margin-top:10px"><button class="s" data-dd="0" style="flex:1">📍 اليوم</button><input type="date" id="dt" value="${S.date}" style="flex:1"><span class="badge ${c?"c":"w"}">${c?"معتمد ✅":"مفتوح ✏️"}</span></div></div>
  <div class="card"><label>💰 توتال التبس</label><input type="number" inputmode="decimal" id="amt" value="${d.amt||""}" ${ta?"":"disabled"} placeholder="0.00" style="font-size:30px;font-weight:800;text-align:center">
  <input id="note" value="${esc(d.note)}" ${ta?"":"disabled"} placeholder="📝 ملاحظة (اختياري)" style="margin-top:8px"><div class="mu" style="margin-top:8px;text-align:center">👥 ${pres} حاضر من ${d.rows.length}</div></div>`;
  d.rows.forEach(r=>{h+=`<div class="card"><div class="row">${av(r.name)}<div style="flex:1"><b>${esc(r.name)}</b><div class="mu">⭐ ${r.pts} نقطة${+r.pts===0?" · <span class='bad'>⚠️ بدون نقاط (نصيبه صفر)</span>":""}</div></div><div class="sh">${n2(r.share)}</div></div>
  <div class="chips ${aa?"":"dis"}">${Object.keys(LB).map(k=>`<span class="chip ${k===r.status?"on":""}" data-att="${r.id}" data-v="${k}">${EM[k]} ${LB[k]}</span>`).join("")}</div>
  <div class="chips ${va?"":"dis"}"><span class="chip ${r.vio?"":"on"}" data-vio="${r.id}" data-v="">🙂 بدون مخالفة</span>${S.cfg.vios.map(v=>`<span class="chip ${v.id===r.vio?"on v":""}" data-vio="${r.id}" data-v="${v.id}">⚠️ ${esc(v.name)} −${v.cut}%</span>`).join("")}</div></div>`});
  if(!d.rows.length)h+=`<div class="card mu" style="text-align:center">👥 ضيف موظفين من تبويب الفريق</div>`;
  if(can("tips"))h+=c?`<button id="reopen" class="d" style="width:100%">🔓 إعادة فتح اليوم</button>`:`<button id="close" style="width:100%;padding:16px;font-size:17px">✅ اعتماد وتقفيل اليوم</button>`;
  $("app").innerHTML=h;
}
function vMonth(){
  let h=mchips(),r=S.rep;
  if(r){const all=r.rows.reduce((a,x)=>a+ +x.total,0);
    h+=`<div class="card"><div class="mu">💰 إجمالي الموزّع في ${mlabel(S.month)}</div><div class="big">${n2(all)}</div><div class="mu">📆 ${r.days} يوم معتمد</div></div><div class="grid">`+r.rows.map(x=>`<div class="card"><div class="row">${av(x.name)}<b style="flex:1;margin-right:2px">${esc(x.name)}</b></div><div class="md" style="margin-top:10px">${n2(x.total)}</div><div class="bar"><i style="width:${all?Math.round(x.total/all*100):0}%"></i></div><div class="chips" style="margin-top:8px"><span class="badge">✅ ${x.present}</span><span class="badge">❌ ${x.absent}</span><span class="badge">⚠️ ${x.vio}</span><span class="badge">⭐ ${x.pts}</span></div></div>`).join("")+`</div>`}
  h+=`<div class="card"><h2>📚 أيام الشهر</h2>${S.dl.map(d=>`<button class="drow" data-open="${d.day}"><span><b>${d.day.slice(5)}</b> <span class="mu">${wd(d.day)}</span></span><span>${d.amt!=null?n2(d.amt)+" ":""}<span class="badge ${d.closed?"c":"w"}">${d.closed?"معتمد":"مفتوح"}</span></span></button>`).join("")||'<div class="mu">لا أيام مسجلة في الشهر ده 🌱</div>'}</div>`;
  $("app").innerHTML=h;
}
function vTeam(){
  $("app").innerHTML=`<div class="grid"><div class="card tile" data-sheet="new"><div class="av" style="--h:30">＋</div><b>إضافة موظف</b><div class="mu">ولينك خاص</div></div>`+S.list.map(s=>`<div class="card tile" data-sheet="${s.id}">${av(s.name)}<b>${esc(s.name)}${s.id===S.me.id?" (أنت)":""}</b><div class="mu">⭐ ${s.pts} نقطة</div><div style="margin-top:6px"><span class="badge ${s.active?"c":""}">${s.active?"نشط":"موقوف"}</span>${+s.pts===0?' <span class="badge w">⚠️ نقاط؟</span>':""}</div></div>`).join("")+`</div>`;
}
const link=t=>location.origin+location.pathname+"?t="+t;
function drawSheet(){
  const el=$("sheet");
  if(!S.sheet||S.tab!=="team"){S.sheet=null;el.className="";el.innerHTML="";return}
  const nw=S.sheet==="new",s=nw?{id:"new",name:"",pts:"",perms:{tips:false},token:""}:S.list.find(x=>x.id===S.sheet);
  if(!s){S.sheet=null;return drawSheet()}
  const me=s.id===S.me.id;
  el.className="on";
  el.innerHTML=`<div class="bg" data-close></div><div class="panel"><div class="row">${nw?'<h2>➕ موظف جديد</h2>':`<div class="row" style="justify-content:flex-start">${av(s.name)}<h2 style="margin:0">${esc(s.name)}</h2></div>`}<button class="s" data-close>✕</button></div>
  <div class="g2" style="margin:12px 0">${nw?`<input id="nn" placeholder="الاسم">`:`<div class="card" style="margin:0;padding:12px"><div class="mu">الحالة</div><b>${s.active?"نشط ✅":"موقوف ⏸️"}</b></div>`}<div><label>⭐ النقاط (${nw?"الشهر ده":S.month})</label><input type="number" inputmode="decimal" id="${nw?"np":"pp"}" value="${s.pts}" placeholder="مثال: 8"></div></div>
  ${nw?"":`<button class="s" id="savepts" style="width:100%;margin-bottom:6px">حفظ النقاط</button>`}
  <h2 style="margin-top:12px">🔑 الصلاحيات</h2><div class="mu" style="margin-bottom:4px">كل موظف بيشوف نصيبه وحضوره وبس، والباقي بتفتحه أنت:</div>
  ${Object.keys(P).map(k=>`<label class="pr"><input type="checkbox" data-perm="${k}" ${s.perms?.[k]?"checked":""}>${P[k][0]} ${P[k][1]}</label>`).join("")}
  ${nw?`<button id="add" style="width:100%;margin-top:14px;padding:15px">إضافة وإنشاء لينك 🔗</button>`:`<div class="g2" style="margin-top:14px"><button class="s" data-copy="${s.token}">📋 نسخ اللينك</button><button class="s" data-wa="${s.token}">💬 واتساب</button></div>
  <div class="g2" style="margin-top:8px"><button class="s" data-regen="${s.id}">🔄 لينك جديد</button>${me?"<span></span>":`<button class="s" data-tog="${s.id}">${s.active?"⏸️ إيقاف":"▶️ تفعيل"}</button>`}</div>${me?"":`<button class="d" data-del="${s.id}" style="width:100%;margin-top:8px">🗑️ حذف الموظف</button>`}`}</div>`;
}
function vSet(){
  const c=S.cfg;
  $("app").innerHTML=`<div class="card"><h2>🗓️ نسب الاستحقاق حسب الحضور (%)</h2>${Object.keys(LB).map(k=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--ln)"><span>${EM[k]} ${LB[k]}</span><input type="number" style="width:90px" min="0" max="100" value="${c.rates[k]}" data-rate="${k}"></div>`).join("")}</div>
  <div class="card"><h2>⚠️ المخالفات (% بتتخصم من نصيب الموظف)</h2>${c.vios.map(v=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--ln)"><span>${esc(v.name)}</span><span class="row"><input type="number" style="width:80px" value="${v.cut}" data-vcut="${v.id}"><button class="d" data-vdel="${v.id}" style="padding:10px 12px">🗑️</button></span></div>`).join("")}<div class="g2" style="margin-top:12px"><input id="vn" placeholder="اسم المخالفة"><input id="vc" type="number" placeholder="% الخصم"></div><button id="vadd" style="width:100%;margin-top:8px">➕ إضافة مخالفة</button></div>
  <div class="card"><h2>🧾 السجل</h2>${S.log.map(l=>`<div style="padding:9px 0;border-top:1px solid var(--ln)"><div>${esc(l.text)}</div><div class="mu">${esc(l.by)} · ${new Date(l.ts).toLocaleString("en-GB",{timeZone:"Asia/Riyadh"})}</div></div>`).join("")||'<div class="mu">فاضي</div>'}</div>`;
}
const saveCfg=()=>run("tips_cfg_set",{p_rates:S.cfg.rates,p_vios:S.cfg.vios},"تم الحفظ ✓");
const permsOf=()=>Object.fromEntries([...document.querySelectorAll("[data-perm]")].map(x=>[x.dataset.perm,x.checked]));
const share=tk=>open("https://wa.me/?text="+encodeURIComponent("لينك نصيبك في تبس Cafe Supreme ☕:\n"+link(tk)));
document.addEventListener("click",async e=>{
  const t=e.target,d=t.dataset,id=t.id;
  const c=t.closest("[data-att],[data-vio]");
  if(c&&!c.closest(".dis")){
    const r=S.day.rows.find(x=>x.id===(c.dataset.att||c.dataset.vio));
    if(c.dataset.att){r.status=c.dataset.v;vDay();return run("tips_set_att",{p_day:S.date,p_staff:r.id,p_status:c.dataset.v},"✅ اتسجل")}
    r.vio=c.dataset.v||null;vDay();return run("tips_set_vio",{p_day:S.date,p_staff:r.id,p_vio:c.dataset.v},"⚠️ اتطبقت")
  }
  const b=t.closest("button,[data-sheet],[data-mon],[data-open],[data-close]");if(!b)return;const k=b.dataset,bid=b.id;
  try{
    if(k.tab){S.tab=k.tab;S.sheet=null;scrollTo(0,0);return render()}
    if(bid==="rf"){b.classList.add("spin");await render(true);toast("🔄 تم التحديث");setTimeout(()=>b.classList.remove("spin"),700);return}
    if(k.mon){S.month=k.mon;return render()}
    if(k.dd!==undefined){S.date=k.dd==="0"?TODAY():shift(S.date,+k.dd);return render()}
    if(k.open){S.date=k.open;S.tab=tabs().some(x=>x[0]==="day")?"day":S.tab;scrollTo(0,0);return render()}
    if(k.sheet){S.sheet=k.sheet;return drawSheet()}
    if(k.close!==undefined){S.sheet=null;return drawSheet()}
    if(bid==="close"){if(confirm("اعتماد اليوم؟ التوزيع هيتحفظ ومحدش هيقدر يعدله."))await run("tips_close",{p_day:S.date},"✅ اتعتمد اليوم");return}
    if(bid==="reopen"){const r=prompt("سبب إعادة الفتح؟");if(r)await run("tips_reopen",{p_day:S.date,p_reason:r},"🔓 اتفتح");return}
    if(bid==="add"){const n=$("nn").value.trim(),p=+$("np").value;if(!n||!(p>0))return toast("اكتب الاسم ونقاط أكبر من صفر");const tk=await api("tips_staff_add",{p_name:n,p_pts:p,p_perms:permsOf()});S.sheet=null;await render();toast("🎉 اتضاف");if(confirm("لينك "+n+" جاهز. إرساله على واتساب؟"))share(tk);return}
    if(bid==="savepts"){const v=+$("pp").value;if(!(v>=0))return;return run("tips_pts_set",{p_id:S.sheet,p_month:S.month,p_pts:v},"⭐ اتحفظت النقاط")}
    if(k.copy){try{await navigator.clipboard.writeText(link(k.copy));toast("📋 اتنسخ اللينك")}catch(x){prompt("انسخ اللينك:",link(k.copy))}return}
    if(k.wa)return share(k.wa);
    if(k.regen){if(confirm("اللينك القديم هيتوقف فورًا. متأكد؟")){await api("tips_staff_regen",{p_id:k.regen});await render();toast("🔄 لينك جديد");}return}
    if(k.tog){const s=S.list.find(x=>x.id===k.tog);return run("tips_staff_set",{p_id:s.id,p_active:!s.active})}
    if(k.del){const s=S.list.find(x=>x.id===k.del);if(confirm("حذف "+s.name+"؟ لينكه هيتوقف فورًا."))await run("tips_staff_del",{p_id:s.id},"🗑️ اتحذف");S.sheet=null;return}
    if(bid==="vadd"){const n=$("vn").value.trim(),v=+$("vc").value;if(!n||!(v>0&&v<=100))return toast("اكتب الاسم ونسبة من 1 إلى 100");S.cfg.vios.push({id:"v"+Date.now().toString(36),name:n,cut:v});return saveCfg()}
    if(k.vdel){S.cfg.vios=S.cfg.vios.filter(v=>v.id!==k.vdel);return saveCfg()}
  }catch(x){fail(x)}
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="dt"&&t.value){S.date=t.value;render()}
  else if(t.id==="amt"||t.id==="note")run("tips_set_amt",{p_day:S.date,p_amt:+$("amt").value||0,p_note:$("note").value},"💰 اتحفظ التوتال");
  else if(d.perm&&S.sheet!=="new")run("tips_staff_set",{p_id:S.sheet,p_perms:permsOf()},"🔑 اتحدثت الصلاحيات");
  else if(d.rate){S.cfg.rates[d.rate]=Math.max(0,Math.min(100,+t.value||0));saveCfg()}
  else if(d.vcut){S.cfg.vios.find(v=>v.id===d.vcut).cut=Math.max(0,Math.min(100,+t.value||0));saveCfg()}
});
function pwa(){
  try{const m={name:"Cafe Supreme · التبس",short_name:"التبس",lang:"ar",dir:"rtl",start_url:location.origin+location.pathname+"?t="+T,scope:location.origin+location.pathname,display:"standalone",background_color:"#111111",theme_color:"#111111",icons:[{src:$("ico").href,sizes:"512x512",type:"image/png",purpose:"any"}]};
  const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l)}catch(e){}
}
setInterval(()=>{if(document.hidden||!S.me||S.sheet)return;const a=document.activeElement;if(a&&a.tagName==="INPUT")return;render(true)},45000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.me&&!S.sheet)render(true)});
(async()=>{
  if(!T)return block("🔗 افتح اللينك الخاص بك اللي اتبعتلك.");
  pwa();
  try{const m=await api("tips_me",{p_month:S.month});S.me=m.me;S.cfg=m.cfg;S.mine=m;$("who").textContent="أهلًا "+m.me.name+" 👋";await render()}catch(e){fail(e)}
})();
</script>
</body>
</html>
