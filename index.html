  const m=e.message||"";
  if(/unauthorized/.test(m))return block("اللينك ده غير صالح أو تم إيقافه.<br><span class='mu'>اطلب لينك جديد من المسؤول.</span>");
  alert(/closed/.test(m)?"اليوم معتمد ومقفول":/forbidden/.test(m)?"مفيش صلاحية للعملية دي":/no_amount/.test(m)?"اكتب إجمالي التبس الأول":/no_eligible/.test(m)?"مفيش موظف مستحق لليوم":/self/.test(m)?"مينفعش تعدّل حسابك أنت":"حصل خطأ: "+m);
  render();
}
async function run(fn,a){try{await api(fn,a);await render()}catch(e){fail(e)}}
function tabs(){
  const t=[["mine","نصيبي"]];
  if(can("tips")||can("att")||can("vio")||can("view_all"))t.unshift(["day","اليوم"]);
  if(can("view_all")||can("manage"))t.push(["month","الشهر"]);
  if(can("manage"))t.push(["team","الفريق"],["set","الإعدادات"]);
  return t;
}
async function render(){
  if(!S.me)return;
  const t=tabs();if(S.first){S.tab=t[0][0];S.first=false}if(!t.some(x=>x[0]===S.tab))S.tab=t[0][0];
  $("nav").innerHTML=t.length>1?t.map(x=>`<button data-tab="${x[0]}" class="${S.tab===x[0]?"on":""}">${x[1]}</button>`).join(""):"";
  $("nav").style.display=t.length>1?"flex":"none";
  try{
    if(S.tab==="mine")S.mine=await api("tips_me",{p_month:S.month});
    if(S.tab==="day")S.day=await api("tips_day_get",{p_day:S.date});
    if(S.tab==="month")S.rep=await api("tips_report",{p_month:S.month});
    if(S.tab==="team")S.list=await api("tips_staff_list",{p_month:S.month});
    if(S.tab==="set"){S.log=await api("tips_log_list")}
  }catch(e){return fail(e)}
  ({mine:vMine,day:vDay,month:vMonth,team:vTeam,set:vSet}[S.tab])();
}
function vMine(){
  const m=S.mine,tot=m.days.reduce((a,d)=>a+(+d.share||0),0),td=m.today;
  $("app").innerHTML=`<div class="card"><div class="mu">أهلًا ${esc(S.me.name)} · نصيبك النهارده</div><div class="big">${td?.closed?n2(td.share):"—"}</div><div class="mu">${td?.closed?LB[td.status]:"لسه اليوم ما اتقفلش"}</div></div>
  <div class="g2"><div class="card"><div class="mu">إجمالي الشهر</div><div class="big" style="font-size:26px">${n2(tot)}</div></div><div class="card"><div class="mu">نقاطك</div><div class="big" style="font-size:26px">${m.pts}</div></div></div>
  <div class="card"><div class="row"><h2>أيام الشهر (${m.days.length})</h2><input type="month" id="mm" value="${S.month}" style="width:150px"></div><div class="scroll"><table><tr><th>اليوم</th><th>الحالة</th><th>مخالفة</th><th>النصيب</th></tr>${m.days.map(d=>`<tr><td>${d.day.slice(5)}</td><td>${LB[d.status]}</td><td>${d.vio?esc(vname(d.vio)):"—"}</td><td><b>${n2(d.share)}</b></td></tr>`).join("")||'<tr><td colspan="4" class="mu">لا أيام معتمدة بعد</td></tr>'}</table></div></div>`;
}
function vDay(){
  const d=S.day,c=d.closed,ta=can("tips")&&!c,aa=can("att")&&!c,va=can("vio")&&!c;
  let h=`<div class="card"><div class="row"><div style="flex:1"><label>التاريخ</label><input type="date" id="dt" value="${S.date}"></div>${c?'<span class="badge c">معتمد ✓</span>':'<span class="badge">مفتوح</span>'}</div></div>
  <div class="card"><label>إجمالي تبس اليوم (عملاء + فائض)</label><input type="number" inputmode="decimal" id="amt" value="${d.amt||""}" ${ta?"":"disabled"} placeholder="0.00" style="font-size:24px;font-weight:700">
  <label style="margin-top:10px">ملاحظة</label><input id="note" value="${esc(d.note)}" ${ta?"":"disabled"}></div>
  <div class="card"><h2>الحضور والمخالفات</h2>`;
  d.rows.forEach(r=>{h+=`<div class="st"><div class="row"><div><b>${esc(r.name)}</b><div class="mu">${r.pts} نقطة</div></div><div class="sh">${n2(r.share)}</div></div>
  <div class="g2" style="margin-top:6px"><select data-att="${r.id}" ${aa?"":"disabled"}>${Object.keys(LB).map(k=>`<option value="${k}" ${k===r.status?"selected":""}>${LB[k]}</option>`).join("")}</select>
  <select data-vio="${r.id}" ${va?"":"disabled"}><option value="">بدون مخالفة</option>${S.cfg.vios.map(v=>`<option value="${v.id}" ${v.id===r.vio?"selected":""}>${esc(v.name)} (−${v.cut}%)</option>`).join("")}</select></div></div>`});
  h+=`</div>`;
  if(can("tips"))h+=c?`<button id="reopen" class="d" style="width:100%">إعادة فتح اليوم</button>`:`<button id="close" style="width:100%">اعتماد وتقفيل اليوم</button>`;
  $("app").innerHTML=h;
}
function vMonth(){
  const r=S.rep,all=r.rows.reduce((a,x)=>a+ +x.total,0);
  $("app").innerHTML=`<div class="card"><label>الشهر</label><input type="month" id="mm" value="${S.month}"><div class="row" style="margin-top:12px"><span class="mu">إجمالي الموزّع (${r.days} يوم)</span><span class="big">${n2(all)}</span></div></div>
  <div class="card scroll"><table><tr><th>الموظف</th><th>نقاط</th><th>حضور</th><th>غياب</th><th>مخالفات</th><th>المستحق</th></tr>${r.rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.pts}</td><td>${x.present}</td><td>${x.absent}</td><td>${x.vio}</td><td><b>${n2(x.total)}</b></td></tr>`).join("")}</table></div>`;
}
const pbox=(sid,p)=>Object.keys(P).map(k=>`<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx);margin:6px 0"><input type="checkbox" style="width:20px;height:20px" data-perm="${k}" data-sid="${sid}" ${p?.[k]?"checked":""}>${P[k]}</label>`).join("");
const link=t=>location.origin+location.pathname+"?t="+t;
function vTeam(){
  let h=`<div class="card"><div class="row"><h2>الفريق</h2><input type="month" id="mm" value="${S.month}" style="width:150px"></div></div>`;
  S.list.forEach(s=>{h+=`<div class="card"><div class="row"><b>${esc(s.name)}${s.id===S.me.id?" (أنت)":""}</b><span class="badge ${s.active?"c":""}">${s.active?"نشط":"موقوف"}</span></div>
  <div class="row" style="margin:8px 0"><label style="margin:0">نقاط ${S.month}</label><input type="number" style="width:90px" value="${s.pts}" data-pts="${s.id}"></div>
  <label>الصلاحيات</label>${pbox(s.id,s.perms)}
  <div class="g2" style="margin-top:8px"><button class="s" data-copy="${s.token}">نسخ اللينك</button><button class="s" data-wa="${s.token}">إرسال واتساب</button></div>
  <div class="g2" style="margin-top:8px"><button class="s" data-regen="${s.id}">لينك جديد</button>${s.id===S.me.id?"":`<button class="s" data-tog="${s.id}">${s.active?"إيقاف":"تفعيل"}</button>`}</div>
  ${s.id===S.me.id?"":`<button class="d" data-del="${s.id}" style="width:100%;margin-top:8px">حذف الموظف</button>`}</div>`});
  h+=`<div class="card"><h2>إضافة موظف</h2><div class="g2"><input id="nn" placeholder="الاسم"><input id="np" type="number" placeholder="النقاط"></div><div style="margin-top:6px">${pbox("new",{})}</div><button id="add" style="width:100%;margin-top:8px">إضافة وإنشاء لينك</button></div>`;
  $("app").innerHTML=h;
}
function vSet(){
  const c=S.cfg;
  $("app").innerHTML=`<div class="card"><h2>نسب الاستحقاق حسب الحضور (%)</h2>${Object.keys(LB).map(k=>`<div class="row st"><span>${LB[k]}</span><input type="number" style="width:90px" min="0" max="100" value="${c.rates[k]}" data-rate="${k}"></div>`).join("")}</div>
  <div class="card"><h2>المخالفات (% بتتخصم من نصيب الموظف)</h2>${c.vios.map(v=>`<div class="row st"><span>${esc(v.name)}</span><span class="row"><input type="number" style="width:80px" value="${v.cut}" data-vcut="${v.id}"><button class="d" data-vdel="${v.id}">حذف</button></span></div>`).join("")}<div class="g2" style="margin-top:12px"><input id="vn" placeholder="اسم المخالفة"><input id="vc" type="number" placeholder="% الخصم"></div><button id="vadd" style="width:100%;margin-top:8px">إضافة مخالفة</button></div>
  <div class="card"><h2>السجل</h2>${S.log.map(l=>`<div class="st"><div>${esc(l.text)}</div><div class="mu">${esc(l.by)} · ${new Date(l.ts).toLocaleString("en-GB",{timeZone:"Asia/Riyadh"})}</div></div>`).join("")||'<div class="mu">فاضي</div>'}</div>`;
}
const saveCfg=()=>run("tips_cfg_set",{p_rates:S.cfg.rates,p_vios:S.cfg.vios});
const permsOf=sid=>Object.fromEntries([...document.querySelectorAll(`[data-sid="${sid}"]`)].map(x=>[x.dataset.perm,x.checked]));
async function reloadMe(){S.cfg=(await api("tips_me",{p_month:S.month})).cfg}
document.addEventListener("click",async e=>{
  const t=e.target,d=t.dataset,id=t.id;
  if(d.tab){S.tab=d.tab;return render()}
  try{
    if(id==="close"){if(confirm("اعتماد اليوم؟ التوزيع هيتحفظ ومحدش هيقدر يعدله."))await run("tips_close",{p_day:S.date})}
    else if(id==="reopen"){const r=prompt("سبب إعادة الفتح؟");if(r)await run("tips_reopen",{p_day:S.date,p_reason:r})}
    else if(id==="add"){const n=$("nn").value.trim(),p=+$("np").value;if(!n||$("np").value==="")return alert("اكتب الاسم والنقاط");const tk=await api("tips_staff_add",{p_name:n,p_pts:p,p_perms:permsOf("new")});await render();if(confirm("تم. لينك "+n+":\n"+link(tk)+"\n\nإرساله على واتساب؟"))open("https://wa.me/?text="+encodeURIComponent("لينك نصيبك في تبس Cafe Supreme:\n"+link(tk)))}
    else if(d.copy){try{await navigator.clipboard.writeText(link(d.copy));alert("تم نسخ اللينك")}catch(x){prompt("انسخ اللينك:",link(d.copy))}}
    else if(d.wa)open("https://wa.me/?text="+encodeURIComponent("لينك نصيبك في تبس Cafe Supreme:\n"+link(d.wa)));
    else if(d.regen){if(confirm("اللينك القديم هيتوقف فورًا. متأكد؟")){await api("tips_staff_regen",{p_id:d.regen});await render()}}
    else if(d.tog){const s=S.list.find(x=>x.id===d.tog);await run("tips_staff_set",{p_id:s.id,p_active:!s.active})}
    else if(d.del){const s=S.list.find(x=>x.id===d.del);if(confirm("حذف "+s.name+"؟ لينكه هيتوقف فورًا ومش هيقدر يشوف أي حاجة."))await run("tips_staff_del",{p_id:s.id})}
    else if(id==="vadd"){const n=$("vn").value.trim(),c=+$("vc").value;if(!n||!(c>0&&c<=100))return alert("اكتب الاسم ونسبة من 1 إلى 100");S.cfg.vios.push({id:"v"+Date.now().toString(36),name:n,cut:c});saveCfg()}
    else if(d.vdel){S.cfg.vios=S.cfg.vios.filter(v=>v.id!==d.vdel);saveCfg()}
  }catch(x){fail(x)}
});
document.addEventListener("change",async e=>{
  const t=e.target,d=t.dataset;
  if(t.id==="dt"){S.date=t.value;render()}
  else if(t.id==="mm"){S.month=t.value;render()}
  else if(t.id==="amt"||t.id==="note")run("tips_set_amt",{p_day:S.date,p_amt:+$("amt").value||0,p_note:$("note").value});
  else if(d.att)run("tips_set_att",{p_day:S.date,p_staff:d.att,p_status:t.value});
  else if(d.vio!==undefined)run("tips_set_vio",{p_day:S.date,p_staff:d.vio,p_vio:t.value});
  else if(d.perm&&d.sid!=="new")run("tips_staff_set",{p_id:d.sid,p_perms:permsOf(d.sid)});
  else if(d.pts)run("tips_pts_set",{p_id:d.pts,p_month:S.month,p_pts:+t.value});
  else if(d.rate){S.cfg.rates[d.rate]=Math.max(0,Math.min(100,+t.value||0));saveCfg()}
  else if(d.vcut){S.cfg.vios.find(v=>v.id===d.vcut).cut=Math.max(0,Math.min(100,+t.value||0));saveCfg()}
});
(async()=>{
  if(SB_URL.startsWith("PASTE"))return block("لازم تحط رابط Supabase والـ anon key في أول ملف index.html.");
  if(!T)return block("افتح اللينك الخاص بك اللي اتبعتلك.");
  try{const m=await api("tips_me",{p_month:S.month});S.me=m.me;S.cfg=m.cfg;S.mine=m;$("who").textContent="أهلًا "+m.me.name;await render()}catch(e){fail(e)}
})();
</script>
</body>
</html>
