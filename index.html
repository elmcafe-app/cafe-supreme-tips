*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums}
body{min-height:100vh;min-height:100dvh;overscroll-behavior:none;padding:0 0 calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 460px at 92% 96%,var(--tint),transparent 70%),radial-gradient(460px 420px at 4% 62%,var(--tint2),transparent 70%),var(--bg)}
html.lock,html.lock body{overflow:hidden;height:100%}
svg{display:block;flex:none}
header{z-index:6;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 14px;max-width:680px;margin:auto;text-align:center;position:relative}
.logo{width:112px;aspect-ratio:560/221;margin:auto;background:var(--tx);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.sub{color:var(--mu);font-size:12px;margin-top:2px}
.hb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 28px);width:40px;height:40px;padding:0;border-radius:50%}#rf{left:14px}#bk{right:14px}#rf.spin svg{animation:sp .8s linear}@keyframes sp{to{transform:rotate(360deg)}}
main{padding:10px 14px;max-width:680px;margin:auto}.view{animation:vin .34s cubic-bezier(.2,.8,.2,1)}@keyframes vin{from{opacity:0;transform:translateY(12px)}}
.card,.bar,nav,.panel,button.s{background:var(--cd);border:1px solid var(--cb);box-shadow:var(--sh),inset 0 1px 0 var(--hl)}
nav,.panel{-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.card,.bar{overflow-wrap:break-word}.nw{white-space:nowrap}.lp.n{background:#9aa5a0;box-shadow:none}.scrl{max-height:260px;overflow:auto}.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mt>div{background:var(--in);border-radius:14px;padding:9px 10px;min-width:0}.mt span{display:block;font-size:11.5px;color:var(--mu)}.mt b{display:block;font-size:15px;margin-top:1px;white-space:nowrap}.row>*{min-width:0}.alert>div{min-width:0}
.card{border-radius:24px;padding:16px;margin-bottom:12px}.bar{border-radius:24px;padding:14px 16px;margin-bottom:10px;display:block;width:100%;height:auto;min-height:0;white-space:normal;text-align:right;color:var(--tx);cursor:pointer;font-weight:500}
.hero{border-radius:24px;padding:20px;margin-bottom:12px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.2),transparent 55%),linear-gradient(150deg,#27a574 0%,#157a52 55%,#0f5a3c 100%);border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 30px rgba(20,60,42,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.hn{font-size:38px;font-weight:700;letter-spacing:-1px;margin:6px 0 14px;color:#fff;line-height:1.1}
.hs{display:flex;gap:10px;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}.hs div{flex:1}.hs span{display:block;font-size:12px;opacity:.72}.hs b{font-weight:600;font-size:15px}
.hero .lb{color:#fff}.hero .av{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
h2{font-size:16px;font-weight:600;margin:0 0 10px}h3{font-size:12.5px;color:var(--mu);margin:18px 8px 8px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:5px;font-weight:500}
input,select{width:100%;height:46px;padding:0 14px;border-radius:16px;color:var(--tx);font:inherit;font-size:16px;outline:0;background:var(--in);border:1px solid var(--ln)}input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--prs)}
button{min-height:46px;padding:10px 16px;line-height:1.35;border:0;border-radius:16px;background:var(--pr);color:var(--prt);font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,opacity .15s}button:active{filter:brightness(.9);opacity:.9}
button.s{color:var(--tx);box-shadow:var(--sh),inset 0 1px 0 var(--hl)}button.d{background:none;color:var(--bd);border:1px solid var(--bd);box-shadow:none}button.gr{background:var(--ok);color:#fff}button.rd{background:var(--bd);color:#fff}button.ye{background:var(--wn);color:#fff}button:disabled{opacity:.4}.w{width:100%}

    if(k.install!==undefined&&S.ip){S.ip.prompt();await S.ip.userChoice;S.ip=null;return paint(true)}
    if(k.srch!==undefined){S.sr=!S.sr;if(!S.sr)S.q="";paint(true);if(S.sr)setTimeout(()=>$("sq")&&$("sq").focus(),60);return}
    if(k.tab){S.q="";S.sr=false;S.tab=k.tab;S.inDay=false;S.sheet=null;drawSheet();drawNav(tabs());vib();scrollTo(0,0);return render({anim:1})}
    if(k.theme){setTheme(k.theme);return paint(true)}
    if(k.mon){S.month=k.mon;S.accd=null;S.pstart=null;return render({anim:1})}

    if(k.open){S.date=k.open;S.inDay=true;if(!tabs().some(x=>x[0]===S.tab))S.tab=tabs()[0][0];scrollTo(0,0);return render({anim:1})}
    if(k.newday!==undefined){const v=$("nd").value;if(!v)return;S.date=v;S.inDay=true;scrollTo(0,0);return render({anim:1})}
    if(k.sheet){const adv=k.sheet.startsWith("adv");if(adv&&S.sheet&&!String(S.sheet).startsWith("adv"))S.sbk=S.sheet;if(!adv){S.sbk=null;S.ad=null}if(k.sheet.startsWith("acc")){S.accd=null;S.daysAll=false}S.sheet=k.sheet;if(adv&&!(S.acc||[]).length&&!S.day)S.acc=await api("tips_acc",{p_month:S.month});return drawSheet()}
    if(k.close!==undefined){S.sheet=(S.sbk&&String(S.sheet).startsWith("adv"))?S.sbk:null;S.sbk=null;if(!S.sheet)S.ad=null;return drawSheet()}
    if(id==="amtok")return submitAmt();
    if(id==="attsave"){sv();const sid=k.id,a=S.ad;load("جاري الحفظ");
      await api("tips_set_att",{p_day:S.date,p_staff:sid,p_status:a.st});
      const cv=a.vm==="custom";if(cv&&!(+a.cut>=0&&a.cut!==""))throw new Error("badcut");
      await api("tips_set_vio2",{p_day:S.date,p_staff:sid,p_vio:a.vm.startsWith("p:")?a.vm.slice(2):"",p_note:a.vm==="none"?"":a.note,p_cut:cv?+a.cut:null});
      S.sheet=null;S.ad=null;load("",false);await render({fresh:1,keep:1});return toast("تم حفظ بيانات الموظف")}
    if(id==="dist")return run("tips_distribute",{p_day:S.date},"تم توزيع التبس");
    if(id==="close"){if(await ask({title:"اعتماد اليوم",text:"يثبّت التبس والحضور. لن يمكن تعديله إلا بإعادة الفتح.",ok:"اعتماد"}))await run("tips_close",{p_day:S.date},"تم اعتماد اليوم");return}
    if(id==="reopen"){const r=await ask({title:"إعادة فتح اليوم",input:1,req:1,ph:"سبب إعادة الفتح",ok:"فتح"});if(r)await run("tips_reopen",{p_day:S.date,p_reason:r},"تم فتح اليوم");return}
    if(id==="delday"){const ex=(+S.day.adv_day||0)+(+S.day.pay_day||0);if(await ask({title:"حذف اليوم",text:"حذف "+dfmt(S.date)+" نهائيًا؟"+(ex?"\nسيُحذف معه سلف/صرف مسجّل في نفس اليوم بقيمة "+n2(ex):""),ok:"حذف",danger:1})){await api("tips_day_del",{p_day:S.date});S.inDay=false;S.cache={};await render({fresh:1});toast("تم حذف اليوم")}return}
    if(id==="backup")return backup();if(id==="reset"){if(await ask({title:"مسح بيانات التجربة",text:"سيُحذف كل الأيام والسلف والصرف وسجل العمليات.\nالموظفون والنقاط والإعدادات تبقى.",input:1,must:"مسح",ph:"اكتب: مسح",ok:"مسح",danger:1})){load("جاري المسح");await api("tips_reset_data");clrCache();S.inDay=false;load("",false);await render({fresh:1});toast("تم مسح بيانات التجربة")}return}
    if(id==="add"){const n=$("nn").value.trim(),p=+$("np").value;if(!n||!(p>0))return toast("اكتب الاسم ونقاطًا أكبر من صفر");b.disabled=true;const tk=await api("tips_staff_add",{p_name:n,p_pts:p,p_perms:permsOf()});S.sheet=null;await render({fresh:1});toast("تمت إضافة الموظف");if(await ask({title:"تمت إضافة "+n,text:"إرسال اللينك عبر واتساب؟",ok:"إرسال"}))share(tk);return}
    if(id==="savepts"){const v=+$("pp").value;if(!(v>0))return toast("النقاط يجب أن تكون أكبر من صفر");return run("tips_pts_set",{p_id:S.sheet,p_month:CM(),p_pts:v},"تم حفظ النقاط")}
    if(id==="asave"){const a=+$("aa").value;if(!(a>0))return toast("اكتب المبلغ");if(S.sv)return;S.sv=true;b.disabled=true;b.textContent="جاري الحفظ…";try{
      const args={p_staff:$("as").value,p_kind:k.kind,p_amt:a,p_day:$("ad").value,p_note:$("an").value,p_force:false};
      try{await api("tips_adv_add",args)}catch(e){const mm=(e.message||"").match(/no_cash: (.*)/);if(!mm)throw e;
        const go=await ask({title:"الخزنة لا تكفي",text:"المتاح في الخزنة حتى "+dfmt(args.p_day)+": "+n2(Math.max(+mm[1],0))+"\nالمطلوب: "+n2(a)+"\nتسجيل المبلغ كحالة اضطرارية؟",ok:"تسجيل اضطراري",danger:1});if(!go)return;await api("tips_adv_add",{...args,p_force:true})}
      S.sheet=S.sbk||null;S.sbk=null;S.accd=null;await render({fresh:1,keep:1});return toast("تم التسجيل")}finally{S.sv=false;if(document.body.contains(b)){b.disabled=false;b.textContent="حفظ"}}}
    if(k.adel){if(await ask({title:"حذف العملية",text:"حذف هذه العملية؟",ok:"حذف",danger:1})){await api("tips_adv_del",{p_id:+k.adel});S.accd=null;await render({fresh:1,keep:1});toast("تم الحذف")}return}
    if(k.copy){try{await navigator.clipboard.writeText(link(k.copy));toast("تم نسخ اللينك")}catch(x){toast("تعذّر النسخ، استخدم واتساب")}return}
    if(k.wa)return share(k.wa);
    if(k.regen){if(await ask({title:"لينك جديد",text:"سيتوقف اللينك القديم فورًا.",ok:"متابعة"})){await api("tips_staff_regen",{p_id:k.regen});await render({fresh:1,keep:1});toast("تم إنشاء لينك جديد")}return}
    if(k.tog){const s=S.list.find(x=>x.id===k.tog);return run("tips_staff_set",ssd(s.id,{p_active:!s.active}))}
    if(k.del){const s=S.list.find(x=>x.id===k.del);if(await ask({title:"حذف "+s.name,text:"سيتوقف لينكه فورًا.",ok:"حذف",danger:1}))await run("tips_staff_del",{p_id:s.id},"تم حذف الموظف");S.sheet=null;return}
    if(id==="vadd"){const n=$("vn").value.trim(),v=+$("vc").value;if(!n||!(v>0&&v<=100))return toast("اكتب الاسم ونسبة من 1 إلى 100");S.cfg.vios.push({id:"v"+Date.now().toString(36),name:n,cut:v});return run("tips_cfg_set",{p_rates:S.cfg.rates,p_vios:S.cfg.vios})}
    if(k.vdel){S.cfg.vios=S.cfg.vios.filter(v=>v.id!==k.vdel);return run("tips_cfg_set",{p_rates:S.cfg.rates,p_vios:S.cfg.vios})}
  }catch(x){if(x.message==="badcut"){load("",false);return toast("اكتب نسبة الخصم")}fail(x)}
});
function sv(){if(S.ad){const n=$("vnote"),c=$("vcut");if(n)S.ad.note=n.value;if(c)S.ad.cut=c.value}}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.ip=e;if(S.me)paint(true)});
document.addEventListener("input",e=>{if(e.target.id==="sq"){S.q=e.target.value;const p=e.target.selectionStart;paint(true);const n=$("sq");if(n){n.focus();n.setSelectionRange(p,p)}}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="amtv")submitAmt()});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.perm&&S.sheet!=="new")run("tips_staff_set",ssd(S.sheet,{p_perms:permsOf()}),"تم تحديث الصلاحيات");
  else if(d.rate){S.cfg.rates[d.rate]=Math.max(-100,Math.min(100,+t.value||0));run("tips_cfg_set",{p_rates:S.cfg.rates,p_vios:S.cfg.vios})}
  else if(d.vcut){S.cfg.vios.find(v=>v.id===d.vcut).cut=Math.max(0,Math.min(100,+t.value||0));run("tips_cfg_set",{p_rates:S.cfg.rates,p_vios:S.cfg.vios})}
});
function pwa(){try{const m={name:"Cafe Supreme · التبس",short_name:"التبس",lang:"ar",dir:"rtl",start_url:location.origin+location.pathname+"?t="+T,scope:location.origin+location.pathname,display:"standalone",background_color:"#eeebe5",theme_color:"#eeebe5",icons:[{src:$("ico").href,sizes:"512x512",type:"image/png",purpose:"any"}]};const l=document.querySelector("link[rel=manifest]");l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}))}catch(e){}}
const idle=()=>!document.hidden&&S.me&&!S.sheet&&Date.now()-S.last>5000&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName));
setInterval(()=>{if(idle())render({keep:1})},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.me&&!S.sheet)render({keep:1})});
async function backup(){
  try{load("جاري تجهيز النسخة");const j=await api("tips_export");load("",false);const f=new File([JSON.stringify(j,null,1)],"tips-backup-"+TODAY()+".json",{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"نسخة احتياطية - التبس"})}else{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast("تم تنزيل النسخة")}}
  catch(e){load("",false);if(e&&e.name==="AbortError")return;fail(e)}
}
let py=0,pd=0,pa=false;
document.addEventListener("touchstart",e=>{const g=e.target.closest&&e.target.closest(".grab");if(g){S.dg={y:e.touches[0].clientY,p:g.closest(".panel")};return}if(scrollY<=0&&!S.sheet&&e.touches.length===1){py=e.touches[0].clientY;pa=true;pd=0}},{passive:true});
document.addEventListener("touchmove",e=>{if(S.dg){const dy=Math.max(0,e.touches[0].clientY-S.dg.y);S.dg.d=dy;S.dg.p.style.transition="none";S.dg.p.style.transform=`translateY(${dy}px)`;return}
  if(!pa)return;if(scrollY>0){pa=false;return}pd=Math.max(0,e.touches[0].clientY-py);const p=$("ptr");p.style.opacity=1;p.style.width=Math.min(100,pd/85*100)+"%"},{passive:true});
document.addEventListener("touchend",async()=>{
  if(S.dg){const g=S.dg;S.dg=null;if((g.d||0)>110){S.sheet=null;S.ad=null;drawSheet()}else{g.p.style.transition="transform .25s";g.p.style.transform=""}return}
  if(!pa)return;pa=false;const p=$("ptr");
  if(pd>85){p.classList.add("spin2");vib();await render({fresh:1,keep:1});toast("تم التحديث")}
  p.classList.remove("spin2");p.style.opacity=0;p.style.width="0"});
addEventListener("offline",()=>$("off").className="on");addEventListener("online",()=>{$("off").className="";render({fresh:1,keep:1});toast("عاد الاتصال")});
const T0=Date.now();
function splashDone(){const el=$("splash");if(!el)return;setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),650)},Math.max(0,650-(Date.now()-T0)))}
(async()=>{
  setTimeout(splashDone,7000);$("rf").innerHTML=ic("ref",20);$("bk").innerHTML=ic("back",20);
  if(!T){block("افتح اللينك الخاص بك الذي أُرسل إليك.");return splashDone()}
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)){const mf=document.querySelector("link[rel=manifest]");if(mf)mf.remove()}try{"serviceWorker" in navigator&&navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
  const cm=lget("me");
  if(cm){S.me=cm.me;S.cfg=cm.cfg;$("who").textContent=cm.me.name;render({anim:1}).then(splashDone)}
  try{const m=await api("tips_me",{p_month:S.month});lset("me",m);S.me=m.me;S.cfg=m.cfg;$("who").textContent=m.me.name;
    if(!cm){await render({anim:1});splashDone()}else if(JSON.stringify(cm.me)!==JSON.stringify(m.me)||JSON.stringify(cm.cfg)!==JSON.stringify(m.cfg))render({fresh:1,keep:1})}
  catch(e){if(!navigator.onLine&&cm)return;fail(e);splashDone()}
})();
